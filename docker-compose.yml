services:
  mcp-gateway:
    build: .
    container_name: mcp-gateway
    restart: unless-stopped
    ports:
      - '${PORT:-3000}:3000'
    environment:
      GATEWAY_NAME: ${GATEWAY_NAME:-MCP_GATEWAY}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      POSTGRES_CONNECTION_URL: postgres://postgres:postgres@postgres:5432/app
      MONGO_CONNECTION_URL: mongodb://mongo:mongo@mongo:27017/app?authSource=admin
      RABBITMQ_CONNECTION_URL: amqp://guest:guest@rabbitmq:5672
    depends_on:
      postgres:
        condition: service_healthy
      mongo:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy

  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: app
    ports:
      - '5432:5432'
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres -d app']
      interval: 10s
      timeout: 5s
      retries: 5

  mongo:
    image: mongo:7
    restart: unless-stopped
    environment:
      MONGO_INITDB_ROOT_USERNAME: mongo
      MONGO_INITDB_ROOT_PASSWORD: mongo
    ports:
      - '27017:27017'
    volumes:
      - mongo-data:/data/db
    healthcheck:
      test: ['CMD', 'mongosh', '--quiet', '--eval', 'db.adminCommand("ping")']
      interval: 10s
      timeout: 5s
      retries: 5

  rabbitmq:
    image: rabbitmq:3-management-alpine
    restart: unless-stopped
    ports:
      - '5672:5672'
      # Management console: http://localhost:15672 (guest/guest).
      - '15672:15672'
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
    healthcheck:
      test: ['CMD', 'rabbitmq-diagnostics', '-q', 'ping']
      interval: 10s
      timeout: 10s
      retries: 5

volumes:
  postgres-data:
  mongo-data:
  rabbitmq-data:
